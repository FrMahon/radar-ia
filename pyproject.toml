[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-ia"
version = "0.1.0"
description = "Pipeline diario de papers de IA (arXiv) y modelos en tendencia (Hugging Face) → SQLite → tablero estático"
requires-python = ">=3.10"
dependencies = []  # solo librería estándar: corre con poca memoria y sin instalar nada

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radar = ["sql/*.sql", "sql/checks/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
